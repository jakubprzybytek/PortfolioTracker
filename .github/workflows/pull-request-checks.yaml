# Checks for every pull request (Dependabot's included), per agent-playbook/dependabot.
# No AWS access and no secrets: Dependabot PRs don't get the repo's secrets anyway.

name: Pull Request Checks

on:
  pull_request:

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Registry signatures
        run: npm audit signatures
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @portfolio/web

# Continuous delivery: every push to main deploys `int`, runs the tests against it and tags the commit
# with the next minor version (v0.1, v0.2, …); then `prod` deploys from that tag.

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  id-token: write # OIDC → AWS
  contents: write # push the version tag

env:
  AWS_REGION: eu-west-1
  AWS_ROLE: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/GitHub-PortfolioTracker # account number: repository secret (masked in logs)
  NODE_VERSION: "24"

jobs:
  # One job: deploy int, run the tests against it, tag the commit. The tag marks a release that passed int.
  int:
    name: Deploy int + test + tag
    runs-on: ubuntu-latest
    environment: int
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags, for the next version
      # A commit that already has a tag (a re-run) keeps it; otherwise the next minor version.
      - id: version
        run: |
          current=$(git tag --points-at HEAD --list 'v0.*' --sort=-v:refname | head -n1)
          latest=$(git tag --list 'v0.*' --sort=-v:refname | head -n1)
          if [ -n "$current" ]; then version="$current"
          elif [ -z "$latest" ]; then version="v0.1"
          else version="v0.$(( ${latest#v0.} + 1 ))"; fi
          echo "latest=${latest:-none} current=${current:-none} version=$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy int
        run: npx sst deploy --stage int
      # Inside `sst shell`: the tests log in as the stage's test user (Resource.TestUser, TestUserPassword).
      - name: Integration tests (API)
        run: npx sst shell --stage int -- npm run test:integration
        env:
          API_URL: https://int.portfoliotracker.albedoonline.com/api
      - run: npx playwright install --with-deps chromium
      - name: E2E tests (UI)
        run: npx sst shell --stage int -- npm run test:e2e
        env:
          WEB_URL: https://int.portfoliotracker.albedoonline.com
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: packages/web/test-results
          retention-days: 7
      - name: Tag ${{ env.APP_VERSION }}
        run: |
          if git rev-parse -q --verify "refs/tags/$APP_VERSION" >/dev/null; then echo "$APP_VERSION already tagged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$APP_VERSION" -m "Release $APP_VERSION"
          git push origin "$APP_VERSION"

  # prod deploys from the tag once int passed (a matrix, so another stage can be added; `test` was removed 2026-10-23).
  deploy:
    name: Deploy ${{ matrix.stage }}
    needs: int
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [prod]
    environment: ${{ matrix.stage }}
    env:
      APP_VERSION: ${{ needs.int.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.int.outputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy ${{ matrix.stage }}
        run: npx sst deploy --stage ${{ matrix.stage }}

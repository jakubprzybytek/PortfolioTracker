# Continuous delivery (agent-playbook continuous-delivery standard).
# From main (every push, or a manual run with main selected): deploy `int`, run the tests against it, tag the
#   commit with the next release (v0.1, v0.2, …); then `prod` deploys from that tag.
# From any other branch or tag (manual run, "Use workflow from"): the same int deploy and tests, then prod,
#   all from that ref, without a new version or tag (rollback: pick the release tag).

name: Continuous Delivery

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      major:
        description: Bump major version number and release as v(N+1).0
        type: boolean
        default: false

concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  # Deploy int and run the tests against it. Read-only: it runs npm packages and the tests, so it holds no token that
  # can push (a malicious dependency could otherwise push to main, which deploys prod); `tag` pushes the version tag.
  int:
    name: Deploy int + test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC → AWS (infra/github/README.md)
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags, for the next version
          persist-credentials: false # no GitHub token left in .git/config for npm or the tests
      # From main, releases only go forward: the latest vM.N tag + 1 (v0.152 -> v0.153); `major` gives v(M+1).0.
      # `major` works from a commit already released too. Otherwise a commit that already has a tag (a re-run) keeps it.
      # From another ref: no new version; the footer shows the tag name, or <branch>-<short sha>.
      - id: version
        env:
          MAJOR: ${{ inputs.major || false }}
        run: |
          tags() { git tag "$@" --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+$' | head -n1 || true; }
          release=true
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            release=false
            if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; else version="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"; fi
          else
            current=$(tags --points-at HEAD)
            latest=$(tags)
            m=${latest%%.*}; m=${m#v}; n=${latest#*.}
            if [ "$MAJOR" = "true" ]; then
              # Also on a commit that is already released (v0.157 -> v1.0); a re-run of the major release keeps its tag.
              if [ -n "$current" ] && [ "$current" = "$latest" ] && [ "$n" = 0 ]; then version="$current"
              else version="v$(( ${m:-0} + 1 )).0"; fi
            elif [ -n "$current" ]; then version="$current"
            elif [ -z "$latest" ]; then version="v0.1"
            else version="v$m.$(( n + 1 ))"; fi
            echo "latest=${latest:-none} current=${current:-none}"
          fi
          echo "ref=$GITHUB_REF version=$version release=$release"
          # On the run's page from the start (Annotations), before prod is reached.
          if [ "$release" = true ]; then echo "::notice title=Version $version::Release $version: tagged and deployed to prod if int and the tests pass"
          else echo "::notice title=Version $version::$version (no new release): deployed to prod if int and the tests pass"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHub-PortfolioTracker
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gh-portfoliotracker-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Deploy int
        run: npx sst deploy --stage int
      # Inside `sst shell`: the tests log in as the stage's test user (Resource.TestUser, TestUserPassword).
      - name: Integration tests (API)
        run: npx sst shell --stage int -- npm run test:integration
        env:
          API_URL: https://int.portfoliotracker.albedoonline.com/api
      - run: npx playwright install --with-deps chromium
      - name: E2E tests (UI)
        run: npx sst shell --stage int -- npm run test:e2e
        env:
          WEB_URL: https://int.portfoliotracker.albedoonline.com
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results
          path: packages/web/test-results
          retention-days: 7

  # The tag marks a release that passed int. Its own job: the only one with a token that can push, and it runs no npm
  # code. Always runs after int (the step is skipped for a non-release), so prod can depend on it.
  tag:
    name: Tag ${{ needs.int.outputs.release == 'true' && needs.int.outputs.version || '(no release)' }}
    needs: int
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version tag
    env:
      APP_VERSION: ${{ needs.int.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.int.outputs.release == 'true'
        with:
          fetch-depth: 0 # the existing tags
      - name: Tag ${{ env.APP_VERSION }}
        if: needs.int.outputs.release == 'true'
        run: |
          if git rev-parse -q --verify "refs/tags/$APP_VERSION" >/dev/null; then echo "$APP_VERSION already tagged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$APP_VERSION" -m "Release $APP_VERSION"
          git push origin "$APP_VERSION"

  # prod deploys once int passed: a release from its tag, any other ref from the commit int was tested on.
  prod:
    name: Deploy prod ${{ needs.int.outputs.version }}
    needs: [int, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC → AWS
    env:
      APP_VERSION: ${{ needs.int.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.int.outputs.release == 'true' && format('refs/tags/{0}', needs.int.outputs.version) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHub-PortfolioTracker
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gh-portfoliotracker-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Deploy prod
        run: npx sst deploy --stage prod
      # The version at the top of the run's summary page, and as an annotation.
      - name: Summary
        env:
          RELEASE: ${{ needs.int.outputs.release }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [ "$RELEASE" = true ]; then what="Released [$APP_VERSION]($REPO_URL/tree/$APP_VERSION) and deployed it to prod"
          else what="Deployed $APP_VERSION to prod (no new release)"; fi
          echo "## $APP_VERSION on prod" >> "$GITHUB_STEP_SUMMARY"
          echo "$what, commit ${GITHUB_SHA::7}." >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=$APP_VERSION on prod::$APP_VERSION deployed to prod"
